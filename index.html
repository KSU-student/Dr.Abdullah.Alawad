<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>د. عبدالله العواد | Dr. Abdullah Alawad</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      margin: 0; padding: 20px 10px;
      font-family: 'Tajawal', sans-serif;
      background-color: #070c14;
      color: #ffffff;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #111a2e;
      border: 1px solid #1e2d4a;
      border-radius: 20px;
      max-width: 440px; width: 100%;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .avatar {
      width: 130px; height: 130px;
      border-radius: 50%; object-fit: cover;
      border: 3px solid #ffffff;
      margin-bottom: 15px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    h1 { font-size: 24px; margin: 0 0 5px; font-weight: 900; }
    .en-title { font-size: 14px; color: #38bdf8; margin-bottom: 15px; direction: ltr; font-weight: 700; }
    .badge {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 5px 15px; border-radius: 20px;
      font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 20px;
    }
    .specs {
      background: rgba(255,255,255,0.03);
      border-right: 3px solid #38bdf8;
      border-radius: 10px; padding: 12px;
      text-align: right; font-size: 13px; color: #cbd5e1;
      line-height: 1.8; margin-bottom: 20px;
    }
    .btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      font-weight: 800; font-size: 14px; cursor: pointer;
      font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 12px; transition: 0.2s;
    }
    .btn-social { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
    .btn-social:hover { background: rgba(255,255,255,0.15); }
    .btn-book { background: #ffffff; color: #070c14; font-weight: 900; }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; z-index: 10;
    }
    .modal.active { display: flex; }
    .modal-box {
      background: #111a2e; border: 1px solid #1e2d4a; border-radius: 15px;
      width: 85%; max-width: 350px; padding: 20px; text-align: center;
    }
    .social-link {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px;
      color: #fff; text-decoration: none; font-weight: 700; margin-bottom: 10px;
      border: 1px solid #1e2d4a;
    }
    .form-group { text-align: right; margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid #1e2d4a; background: #070c14; color: #fff;
      font-family: inherit; font-size: 14px; box-sizing: border-box;
    }
    .msg { font-size: 12px; margin-top: 8px; font-weight: 700; min-height: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <img src="Dr.png" alt="د. عبدالله العواد" class="avatar" onerror="this.src='Dr.JPG'">
    
    <h1>د. عبدالله العواد</h1>
    <div class="en-title">Dr. Abdullah Alawad</div>
    <div><span class="badge">🩺 إستشاري القسطرة العصبية</span></div>

    <div class="specs">
      • علاج وتدخلات السكتات الدماغية<br>
      • علاج نزيف الدماغ والأوعية الدموية<br>
      • علاج تشوهات الأوعية الدموية (AVM)<br>
      • علاج حالات طنين الأذن الوعائي
    </div>

    <button class="btn btn-social" onclick="toggleModal(true)">
      <i class="fa-solid fa-share-nodes"></i> حسابات التواصل الاجتماعي
    </button>

    <div style="border-top: 1px dashed rgba(255,255,255,0.15); margin-top: 15px; padding-top: 15px;">
      <h3 style="font-size: 15px; margin: 0 0 10px; color: #fff;">📅 حجز موعد</h3>

      <div class="form-group">
        <label>اسم المريض الكامل:</label>
        <input type="text" id="pName" placeholder="أدخل اسمك الثلاثي">
      </div>

      <div class="form-group">
        <label>رقم الجوال:</label>
        <input type="tel" id="pPhone" placeholder="05xxxxxxxx" maxlength="10">
      </div>

      <div class="form-group">
        <label>سبب الزيارة / ملاحظات (اختياري):</label>
        <textarea id="pNotes" rows="2" placeholder="وصف مختصر للحالة..."></textarea>
      </div>

      <div id="pMsg" class="msg"></div>

      <button class="btn btn-book" onclick="sendBooking()">
        <i class="fa-solid fa-calendar-check"></i> تأكيد إرسال الطلب
      </button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="socialModal">
    <div class="modal-box">
      <h3 style="margin-top:0; font-size:16px;">حسابات التواصل الاجتماعي</h3>
      <p style="font-size:12px; color:#94a3b8; margin-bottom:15px;">للتواصل والمتابعة المباشرة:</p>

      <a href="https://x.com/aalboridy?s=11" target="_blank" class="social-link">
        <span><i class="fa-brands fa-x-twitter" style="margin-left:6px;"></i> منصة X</span>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px;"></i>
      </a>

      <a href="https://www.linkedin.com/in/dr-abdullah-alawad-alboridy-345b8726/" target="_blank" class="social-link">
        <span><i class="fa-brands fa-linkedin" style="color:#38bdf8; margin-left:6px;"></i> شبكة LinkedIn</span>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px;"></i>
      </a>

      <button class="btn btn-social" style="margin-top:15px; margin-bottom:0;" onclick="toggleModal(false)">إغلاق</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPN2xfLnIRybX7aa8qZLfMw0CS6l72riPOrtLRc_bTzUNhdRe3bVgPwxUS-boH56Cb/exec";

    function toggleModal(show) {
      document.getElementById('socialModal').classList.toggle('active', show);
    }

    function sendBooking() {
      const name = document.getElementById('pName').value.trim();
      const phone = document.getElementById('pPhone').value.trim();
      const notes = document.getElementById('pNotes').value.trim();
      const msg = document.getElementById('pMsg');

      if (name.length < 5) {
        msg.style.color = "#f87171";
        msg.textContent = "يرجى إدخال الاسم الثلاثي كاملاً.";
        return;
      }
      if (!/^05\d{8}$/.test(phone)) {
        msg.style.color = "#f87171";
        msg.textContent = "رقم الجوال غير صحيح (يجب أن يبدأ بـ 05 ويتكون من 10 أرقام).";
        return;
      }

      msg.style.color = "#38bdf8";
      msg.textContent = "جاري إرسال الطلب...";

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, phone: phone, notes: notes || "حجز جديد" })
      }).then(() => {
        msg.style.color = "#4ade80";
        msg.textContent = "✔ تم إرسال طلب الحجز بنجاح!";
        document.getElementById('pName').value = "";
        document.getElementById('pPhone').value = "";
        document.getElementById('pNotes').value = "";
      }).catch(() => {
        msg.style.color = "#f87171";
        msg.textContent = "حدث خطأ، يجدر المحاولة مجدداً.";
      });
    }
  </script>
</body>
</html>
